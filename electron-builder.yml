# electron-builder: packages the electron-vite build (out/) into a macOS .dmg
# and, for Ubuntu, an AppImage and a .deb. Run after `npm run build`. The build signs
# and notarizes when the Apple secrets are set, else it is unsigned (see the
# handbook's electron-tooling.md).
appId: ai.parkviewlab.garnet-scoping
productName: garnet-scoping
artifactName: ${name}-${version}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - '!src/**'
  - '!docs/**'
  - '!scripts/**'
  - '!channel/**'
  - '!setup/**'
  - '!tests/**'
  - '!.github/**'
  - '!LICENSES/**'
  # Every dependency is bundled into out/ by electron-vite, so no module is
  # loaded from node_modules at run time and none is packaged.
  - '!node_modules/**'
  - '!{electron.vite.config.js,eslint.config.mjs,electron-builder.yml,REUSE.toml,LICENSING.md,CHANGELOG.md,README.md,AGENTS.md,CLAUDE.md,.gitignore}'
mac:
  category: public.app-category.developer-tools
  target: dmg
  hardenedRuntime: true
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Gary Frattarola <garyf@parkviewlab.ai>
  synopsis: A desk for each Claude Code session, beside a shared board
# electron-builder's default dependencies, with the sound library Electron
# loads at start (libasound2t64 on Ubuntu 24.04, libasound2 before it).
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
npmRebuild: false
# Ship the generated license/notice bundle (run `npm run legal` first; CI does
# this before packaging). See electron-tooling.md, "License notices + in-app
# viewer".
extraResources:
  - from: legal
    to: legal
    filter: ['**/*']
  # The channel server (README, "The channel"): run by Claude Code with the
  # app's own binary in Node mode, so it needs no separate Node install.
  - from: channel
    to: channel
    filter: ['*.mjs']
  # What Set-up Info has Claude install: the watcher, its hook and the rule.
  - from: setup
    to: setup
    filter: ['*.sh', '*.md']
publish:
  provider: github
  owner: garycoding
  repo: garnet-scoping
